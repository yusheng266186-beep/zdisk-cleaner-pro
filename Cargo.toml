[workspace]
resolver = "2"
members = ["crates/zc-core", "crates/zc-rules", "crates/zc-cli", "src-tauri"]

# 默认只构建纯逻辑内核（不含需要 MSVC 链接器的 Tauri 壳），
# 本机没有 Visual Studio Build Tools 时 `cargo test` / `cargo clippy` 开箱即用。
default-members = ["crates/zc-core", "crates/zc-rules", "crates/zc-cli"]

[workspace.package]
version = "3.0.5"
edition = "2021"
license = "MIT"
authors = ["yusheng"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
globset = "0.4"
jwalk = "0.8"
rayon = "1"
thiserror = "2"
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Registry",
] }

[profile.release]
lto = "thin"
strip = "symbols"
